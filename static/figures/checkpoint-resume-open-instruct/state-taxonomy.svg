<svg xmlns="http://www.w3.org/2000/svg" width="2244" height="1628" viewBox="0 0 2244 1628" role="img" aria-labelledby="title desc">
<title id="title">A checkpoint is only one part of resumed execution state</title>
<desc id="desc">The persistent checkpoint is restored exactly, while process-local runtime state is recreated. Exact continuation requires the recreated state to be equivalent at every numerically relevant boundary.</desc>
<rect width="2244" height="1628" fill="#121017"/>
<text x="120" y="112" fill="#d66ab7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" opacity="1" letter-spacing="3">RESUME EQUIVALENCE</text>
<text x="120" y="190" fill="#eee8f0" font-family="'Source Serif 4', Georgia, serif" font-size="58" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">Checkpoint state is not execution state</text>
<text x="120" y="244" fill="#aaa2af" font-family="'Source Serif 4', Georgia, serif" font-size="27" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Serialized state is necessary. It is not, by itself, a proof of execution equivalence.</text>
<line x1="120" y1="286" x2="2124" y2="286" stroke="#39333f" stroke-width="2" opacity="1"/>
<rect x="120" y="350" width="616" height="740" rx="16" fill="#1b1822" stroke="#39333f" stroke-width="2" opacity="1"/>
<rect x="814" y="350" width="616" height="740" rx="16" fill="#1b1822" stroke="#39333f" stroke-width="2" opacity="1"/>
<rect x="1508" y="350" width="616" height="740" rx="16" fill="#1b1822" stroke="#39333f" stroke-width="2" opacity="1"/>
<rect x="160" y="390" width="154" height="46" rx="23" fill="#98d66d" stroke="none" stroke-width="1" opacity="1"/>
<text x="237.0" y="421" fill="#09080b" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0">RESTORED</text>
<text x="160" y="476" fill="#eee8f0" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="34" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Persistent state  P[t]</text>
<text x="160" y="555" fill="#aaa2af" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="27" font-weight="400" text-anchor="start">
<tspan x="160" dy="0">model parameters and buffers</tspan>
<tspan x="160" dy="44.55">optimizer moments and scalars</tspan>
<tspan x="160" dy="44.55">scheduler and trainer counters</tspan>
<tspan x="160" dy="44.55">Python, NumPy, CPU, CUDA RNG</tspan>
<tspan x="160" dy="44.55">data cursor and pack schedule</tspan>
</text>
<line x1="160" y1="885" x2="696" y2="885" stroke="#39333f" stroke-width="2" opacity="1"/>
<text x="160" y="952" fill="#98d66d" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="650" text-anchor="start">
<tspan x="160" dy="0">Can be byte-exact</tspan>
<tspan x="160" dy="40.5">after deserialization.</tspan>
</text>
<rect x="854" y="390" width="169" height="46" rx="23" fill="#d69a6d" stroke="none" stroke-width="1" opacity="1"/>
<text x="938.5" y="421" fill="#09080b" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0">RECREATED</text>
<text x="854" y="476" fill="#eee8f0" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="34" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Runtime state  E[t]</text>
<text x="854" y="555" fill="#aaa2af" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="27" font-weight="400" text-anchor="start">
<tspan x="854" dy="0">DDP reducer bucket topology</tspan>
<tspan x="854" dy="44.55">CUDA kernel algorithm choices</tspan>
<tspan x="854" dy="44.55">Triton autotune selections</tspan>
<tspan x="854" dy="44.55">allocator and stream history</tspan>
<tspan x="854" dy="44.55">compiled graphs and caches</tspan>
</text>
<line x1="854" y1="885" x2="1390" y2="885" stroke="#39333f" stroke-width="2" opacity="1"/>
<text x="854" y="952" fill="#d69a6d" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="650" text-anchor="start">
<tspan x="854" dy="0">May depend on process age</tspan>
<tspan x="854" dy="40.5">even when P[t] is exact.</tspan>
</text>
<rect x="1548" y="390" width="154" height="46" rx="23" fill="#78a6d6" stroke="none" stroke-width="1" opacity="1"/>
<text x="1625.0" y="421" fill="#09080b" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0">CONSUMED</text>
<text x="1548" y="476" fill="#eee8f0" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="34" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Next batch  X[t+1]</text>
<text x="1548" y="555" fill="#aaa2af" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="27" font-weight="400" text-anchor="start">
<tspan x="1548" dy="0">same token IDs and positions</tspan>
<tspan x="1548" dy="44.55">same supervised targets</tspan>
<tspan x="1548" dy="44.55">same padding and document map</tspan>
<tspan x="1548" dy="44.55">same accumulation schedule</tspan>
<tspan x="1548" dy="44.55">same rank-local assignment</tspan>
</text>
<line x1="1548" y1="885" x2="2084" y2="885" stroke="#39333f" stroke-width="2" opacity="1"/>
<text x="1548" y="952" fill="#78a6d6" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="650" text-anchor="start">
<tspan x="1548" dy="0">Can produce the same loss</tspan>
<tspan x="1548" dy="40.5">before the first divergence.</tspan>
</text>
<rect x="250" y="1190" width="1744" height="230" rx="16" fill="#211d29" stroke="#d66ab7" stroke-width="2" opacity="1"/>
<text x="1122.0" y="1266" fill="#eee8f0" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="48" font-weight="650" text-anchor="middle" opacity="1" letter-spacing="0">P[t+1] = T(P[t], X[t+1] ; E[t])</text>
<text x="1122.0" y="1330" fill="#aaa2af" font-family="'Source Serif 4', Georgia, serif" font-size="29" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">Same P[t] and same X[t+1] are insufficient when E[t] changes floating-point execution.</text>
<text x="1122.0" y="1380" fill="#d66ab7" font-family="'Source Serif 4', Georgia, serif" font-size="29" font-weight="650" text-anchor="middle" opacity="1" letter-spacing="0">The missing contract is equivalence of every numerically relevant runtime state.</text>
<line x1="120" y1="1536" x2="2124" y2="1536" stroke="#39333f" stroke-width="2" opacity="1"/>
<text x="120" y="1580" fill="#625b68" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1">FIG_01  ·  A practical state model for exact checkpoint resumption</text>
</svg>
