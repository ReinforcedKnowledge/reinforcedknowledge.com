<text x="120" y="112" fill="#d66ab7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="700" text-anchor="start" opacity="1" letter-spacing="3">HIDDEN PROCESS HISTORY</text>
<text x="120" y="190" fill="#eee8f0" font-family="'Source Serif 4', Georgia, serif" font-size="58" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">Reducer state has an age</text>
<text x="120" y="244" fill="#aaa2af" font-family="'Source Serif 4', Georgia, serif" font-size="27" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">A checkpoint at update 5 does not serialize the DDP wrapper that will reduce update 6.</text>
