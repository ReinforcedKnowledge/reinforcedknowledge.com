<svg xmlns="http://www.w3.org/2000/svg" width="2244" height="1628" viewBox="0 0 2244 1628" role="img" aria-labelledby="title desc">
<title id="title">DDP reducer state has an age</title>
<desc id="desc">The continuous process has already rebuilt its reducer into 61 buckets. A newly resumed DDP wrapper begins with one constructor bucket. Priming and rebuilding before the first real training batch gives both branches the mature layout.</desc>
